<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Create Account | BLUE WHALE 2.0</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <main class="auth-page">

        <a
            href="index.html"
            class="back-link"
        >
            ← Back to Home
        </a>


        <section class="auth-card">

            <div class="auth-logo">
                🐋
            </div>


            <h1>

                BLUE WHALE
                <span>2.0</span>

            </h1>


            <p class="auth-subtitle">
                Create your challenger account.
            </p>


            <form id="registerForm">


                <div class="form-group">

                    <label for="registerUsername">
                        Username
                    </label>

                    <input
                        id="registerUsername"
                        type="text"
                        placeholder="Choose a username"
                        minlength="3"
                        maxlength="30"
                        autocomplete="username"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="registerEmail">
                        Email
                    </label>

                    <input
                        id="registerEmail"
                        type="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="registerPassword">
                        Password
                    </label>

                    <input
                        id="registerPassword"
                        type="password"
                        placeholder="Create a password"
                        minlength="6"
                        autocomplete="new-password"
                        required
                    >

                </div>


                <p
                    id="registerMessage"
                    class="auth-message"
                ></p>


                <button
                    type="submit"
                    class="primary-btn"
                >
                    CREATE ACCOUNT →
                </button>


            </form>


            <div class="auth-divider">
                <span>OR</span>
            </div>


            <p class="auth-switch">

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </p>


        </section>

    </main>


    <script
        type="module"
        src="auth.js"
    ></script>

</body>

</html>
