<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | BLUE WHALE 2.0</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="auth-page">

        <a href="index.html" class="back-link">
            ← Back to Home
        </a>

        <section class="auth-card">

            <div class="auth-logo">
                🐋
            </div>

            <h1>
                BLUE WHALE
                <span>2.0</span>
            </h1>

            <p class="auth-subtitle">
                Welcome back, challenger.
            </p>


            <!-- ONLY ONE LOGIN FORM -->

            <form id="loginForm">

                <div class="form-group">

                    <label for="loginEmail">
                        Email
                    </label>

                    <input
                        id="loginEmail"
                        type="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="loginPassword">
                        Password
                    </label>

                    <input
                        id="loginPassword"
                        type="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >

                </div>


                <p
                    id="loginMessage"
                    class="auth-message"
                ></p>


                <button
                    type="submit"
                    class="primary-btn"
                >
                    LOGIN →
                </button>

            </form>


            <div class="auth-divider">
                <span>OR</span>
            </div>


            <p class="auth-switch">

                Don't have an account?

                <a href="register.html">
                    Create one
                </a>

            </p>

        </section>

    </main>


    <!-- Firebase authentication -->

    <script
        type="module"
        src="auth.js"
    ></script>

</body>

</html>
